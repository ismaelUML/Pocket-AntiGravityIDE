# Configuración de SonarCloud para análisis estático de calidad y seguridad.
# Ignoramos la basura de node_modules, uploads y bundles públicos para que no gaste créditos
# ni ensucie el reporte de mantenibilidad y cobertura.

sonar.projectKey=ismaelUML_Pocket-AntiGravityIDE
sonar.organization=ismaeluml

# Rutas de código fuente y tests
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/uploads/**,**/public/assets/**,**/*.bat,bin/**/*.bat

# Entorno y codificación
sonar.javascript.environments=nodejs
sonar.sourceEncoding=UTF-8

# Cobertura de Código (LCOV)
# Excluimos de cobertura módulos nativos de automatización Win32/GUI y banners terminales
# que no aplican a pruebas unitarias en runners headless de CI/CD.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/infrastructure/automation/**,src/infrastructure/terminal/**,src/server.js,bin/**

# Reglas de Calidad y Complejidad
# SonarCloud auditará automáticamente la Complejidad Ciclomática (<= 5),
# Complejidad Cognitiva, Smells de Arquitectura y Vulnerabilidades OWASP.
